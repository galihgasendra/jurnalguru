#gxapp *{box-sizing:border-box}
#gxapp button,#gxapp input,#gxapp select,#gxapp textarea{font:inherit;color:inherit}
#gxapp .gx-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(120deg,var(--pd),var(--p));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}

#gxapp .gx-st{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
#gxapp .gx-st.on{background:#22c55e}#gxapp .gx-st.off{background:#ef4444}#gxapp .gx-st.pd{background:#f59e0b}
#gxapp .gx-wrap{display:flex}
#gxapp .gx-side{width:240px;flex:0 0 240px;background:var(--card);border-right:1px solid var(--bd);min-height:calc(100vh - 58px);padding:12px 10px;position:sticky;top:58px;align-self:flex-start;max-height:calc(100vh - 58px);overflow:auto}
#gxapp .gx-user{padding:10px;border-radius:12px;background:var(--bg);margin-bottom:10px}
#gxapp .gx-user b{display:block}#gxapp .gx-user small{color:var(--mu)}
#gxapp .gx-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;cursor:pointer;font-weight:600;margin-bottom:2px}
#gxapp .gx-nav a:hover{background:var(--bg)}
#gxapp .gx-nav a.act{background:var(--p);color:#fff}
#gxapp .gx-nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:12px 12px 4px}
#gxapp .gx-main{flex:1;min-width:0;padding:16px;max-width:1200px}
#gxapp .gx-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#gxapp .gx-card h2{margin:0 0 12px;font-size:18px;font-weight:800;color:var(--pd)}
#gxapp .gx-card h3{margin:4px 0 10px;font-size:15px}
#gxapp .gx-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
#gxapp label.gx-f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mu)}
#gxapp .gx-in{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;outline:none;min-height:40px}
#gxapp .gx-in:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(20,184,166,.18)}
#gxapp textarea.gx-in{min-height:80px;resize:vertical}
#gxapp .gx-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#gxapp .gx-b{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;min-height:40px;display:inline-flex;align-items:center;gap:6px}
#gxapp .gx-b:hover{filter:brightness(1.08)}
#gxapp .gx-b.s{background:#e2ecea;color:var(--pd)}
#gxapp .gx-b.r{background:var(--er)}#gxapp .gx-b.w{background:var(--wa)}#gxapp .gx-b.g{background:var(--ok)}
#gxapp .gx-b.sm{padding:5px 9px;min-height:30px;font-size:12px;border-radius:8px}
#gxapp .gx-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px;margin-top:12px}
#gxapp table.gx-t{border-collapse:collapse;width:100%;min-width:520px;background:#fff}
#gxapp .gx-t th{background:#e6f2f0;color:var(--pd);text-align:left;font-size:12px;padding:9px 8px;position:sticky;top:0;white-space:nowrap}
#gxapp .gx-t td{border-top:1px solid var(--bd);padding:7px 8px;vertical-align:middle}
#gxapp .gx-t tr:nth-child(even) td{background:#fafcfc}
#gxapp .gx-t .gx-in{min-height:34px;padding:5px 8px}
#gxapp .gx-t input.num{width:72px}
#gxapp .gx-chk{display:inline-flex;gap:10px}
#gxapp .gx-chk label{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px}
#gxapp .gx-chk input{width:20px;height:20px;accent-color:var(--p)}
#gxapp .gx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
#gxapp .gx-stat{background:linear-gradient(135deg,#ecfdf5,#e0f2f1);border-radius:12px;padding:10px 12px}
#gxapp .gx-stat small{display:block;color:var(--mu);font-size:11px;font-weight:600}
#gxapp .gx-stat b{font-size:20px;color:var(--pd)}
#gxapp .gx-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
#gxapp .gx-tag.ok{background:#dcfce7;color:#166534}#gxapp .gx-tag.no{background:#fee2e2;color:#991b1b}
#gxapp .gx-muted{color:var(--mu);font-size:12px}

#gxapp .gx-print{background:#fff}

#gxapp .gx-rp .idt td{padding:2px 4px}
#gxapp .gx-rp .ttd{display:flex;justify-content:space-between;margin-top:26px;text-align:center}
#gxapp .gx-rp .ttd div{width:45%}
#gxapp .gx-rp .ttd .sp{height:64px}

#gxapp .gx-report-bottom{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;align-items:start}
#gxapp [aria-invalid="true"]{border-color:var(--er)}
#gxapp .gx-leger-wrap{overflow-x:auto}
#gxapp .gx-leger{min-width:1000px}
#gxapp .gx-leger th{font-size:11px}
#gxapp .gx-leger td{font-size:12px}
#gxapp .gx-leger .bt thead{display:table-header-group}
#gxapp .gx-leger .bt tr{break-inside:avoid}
#gxapp .gx-legend{margin-top:12px;font-size:11px}
@page gxleger{size:A4 landscape;margin:8mm}
#gxapp .gx-modal{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}

#gxapp .gx-warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:12px 14px;font-weight:600}
#gxapp .gx-rp .ttd{break-inside:avoid;page-break-inside:avoid}
#gxapp .gx-rp .bt tr{break-inside:avoid;page-break-inside:avoid}
@media(max-width:860px){

#gxapp .gx-side{position:fixed;left:0;top:0;bottom:0;z-index:50;max-height:none;height:100vh;transform:translateX(-105%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
#gxapp .gx-side.open{transform:none}
#gxapp .gx-ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}

#gxapp .gx-card{padding:12px;border-radius:14px}
#gxapp .gx-g{grid-template-columns:1fr 1fr}
#gxapp .gx-g .full{grid-column:1/-1}
#gxapp .gx-row .gx-b{flex:1 1 auto;justify-content:center}
#gxapp .gx-rp{padding:10px;font-size:11px}
}
@media(max-width:420px){#gxapp .gx-g{grid-template-columns:1fr}#gxapp .gx-top h1{font-size:14px}}
@media print{
body *{visibility:hidden!important}
#gx-print,#gx-print *{visibility:visible!important}
#gx-print{position:absolute;left:0;top:0;width:100%}
#gx-print .gx-rp{border:0;margin:0;page-break-after:always;font-size:12px}
#gx-print .gx-leger{page:gxleger;min-width:0;padding:0;font-size:10px}
#gx-print .gx-rp:last-child{page-break-after:auto}
#gx-print .gx-rp .ttd,#gx-print .gx-rp .ttd div{break-inside:avoid;page-break-inside:avoid}
#glhgsd{display:none}
}
</style>
